# Build the app and publish dist/ to GitHub Pages.
#
# Requirements on the repo (Settings → Pages):
#   Source: GitHub Actions
#
# Pushes to master rebuild the site. The workflow is the current Pages pattern (v4):
# one job uploads the artifact, the predefined pages-deploy job delivers it.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate the repo uses locally, run in the same place that builds the site.
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
